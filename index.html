// FABRIKA // SYSTEMS — single-file bundle (React + Framer Motion + Lucide)
// ============================================================================
import React, { useState, useEffect, useRef, StrictMode } from 'react';
import { createRoot } from 'react-dom/client';
import { motion, AnimatePresence } from 'framer-motion';
import * as LucideIcons from 'lucide-react';

// ---------------------------------------------------------------------------
// Sound Engine (Web Audio API soft "liquid glass" acoustic feedback)
// ---------------------------------------------------------------------------
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.enabled = false;
  }

  toggleSound(force) {
    this.enabled = force !== undefined ? force : !this.enabled;
    if (this.enabled && !this.ctx) this.initCtx();
    return this.enabled;
  }

  isEnabled() {
    return this.enabled;
  }

  initCtx() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    } catch (e) {
      console.warn('Web Audio API not supported', e);
    }
  }

  ensureCtx() {
    if (!this.ctx) this.initCtx();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  playGlassTap() {
    if (!this.enabled) return;
    this.ensureCtx();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.08);
  }

  playGlassChime() {
    if (!this.enabled) return;
    this.ensureCtx();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;

    const osc1 = this.ctx.createOscillator();
    const gain1 = this.ctx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(1760, now);
    gain1.gain.setValueAtTime(0.02, now);
    gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    osc1.connect(gain1);
    gain1.connect(this.ctx.destination);
    osc1.start(now);
    osc1.stop(now + 0.25);

    const osc2 = this.ctx.createOscillator();
    const gain2 = this.ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(2637, now + 0.06);
    gain2.gain.setValueAtTime(0.015, now + 0.06);
    gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    osc2.connect(gain2);
    gain2.connect(this.ctx.destination);
    osc2.start(now + 0.06);
    osc2.stop(now + 0.35);
  }

  playGlassPulse() {
    if (!this.enabled) return;
    this.ensureCtx();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
    gain.gain.setValueAtTime(0.025, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  }

  playPhoneBeep() {
    if (!this.enabled) return;
    this.ensureCtx();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, now);
    gain.gain.setValueAtTime(0.02, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.18);
  }
}

const soundEngine = new SoundEngine();

// ---------------------------------------------------------------------------
// LiquidGlassCard
// ---------------------------------------------------------------------------
const LiquidGlassCard = ({ children, className = '', variant = 'light', interactive = true, onClick }) => {
  const cardRef = useRef(null);
  const [mousePos, setMousePos] = useState({ x: 50, y: 50 });
  const [isHovered, setIsHovered] = useState(false);

  const handleMouseMove = (e) => {
    if (!cardRef.current || !interactive) return;
    const rect = cardRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    setMousePos({ x, y });
  };

  const getVariantClass = () => {
    switch (variant) {
      case 'dark':
        return 'liquid-glass-dark';
      case 'subtle':
        return 'liquid-glass-subtle';
      case 'light':
      default:
        return 'liquid-glass';
    }
  };

  return (
    <motion.div
      ref={cardRef}
      onMouseMove={handleMouseMove}
      onMouseEnter={() => setIsHovered(true)}
      onMouseLeave={() => setIsHovered(false)}
      onClick={onClick}
      initial={{ opacity: 0, y: 15 }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once: true }}
      transition={{ duration: 0.5, ease: [0.16, 1, 0.3, 1] }}
      className={`relative overflow-hidden rounded-3xl ${getVariantClass()} ${className}`}
    >
      {interactive && isHovered && (
        <div
          className="pointer-events-none absolute inset-0 transition-opacity duration-300 opacity-60 z-0"
          style={{
            background: `radial-gradient(400px circle at ${mousePos.x}% ${mousePos.y}%, rgba(255, 255, 255, 0.45), transparent 80%)`,
          }}
        />
      )}
      <div className="pointer-events-none absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/80 to-transparent opacity-70 z-10" />
      <div className="relative z-10">{children}</div>
    </motion.div>
  );
};

          const nextIndex = currentLineIndex + 1;
          setCurrentLineIndex(nextIndex);

            setEventsCompleted((prev) => [...prev, currentStep.crmEvent]);

                    value={formData.company}
                    onChange={(e) => setFormData({ ...formData, company: e.target.value })}
                    placeholder="ООО «ПромСтальКонструкция»"
                    className="w-full px-4 py-3 rounded-2xl bg-white border border-black/15 text-[#111111] focus:outline-none focus:border-[#111111]"
                  />
                </div>

                <div className="space-y-1">
                  <label className="text-[#5C5C5C] block">Отрасль производства</label>
                  <select
                    value={formData.industry}
                    onChange={(e) => setFormData({ ...formData, industry: e.target.value })}
                    className="w-full px-4 py-3 rounded-2xl bg-white border border-black/15 text-[#111111] focus:outline-none focus:border-[#111111]"
                  >
                    <option value="Металлообработка / Машиностроение">Металлообработка / Машиностроение</option>
                    <option value="Производство строительных материалов">Производство строительных материалов</option>
                    <option value="Химическая и полимерная отрасль">Химическая и полимерная отрасль</option>
                    <option value="Приборостроение и электроника">Приборостроение и электроника</option>
                    <option value="Другое промышленное производство">Другое промышленное производство</option>
                  </select>
                </div>

                <div className="pt-2">
                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="w-full py-4 rounded-2xl bg-[#111111] text-[#FAFAFA] font-mono text-xs font-bold tracking-wide hover:bg-black/80 transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95 disabled:opacity-50"
                  >
                    {isSubmitting ? (
                      <>
                        <LucideIcons.Loader2 size={16} className="animate-spin" />
                        <span>ОТПРАВКА ДАННЫХ...</span>
                      </>
                    ) : (
                      <>
                        <span>ОТПРАВИТЬ ЗАЯВКУ НА АУДИТ</span>
                        <LucideIcons.ArrowRight size={16} />
                      </>
                    )}
                  </button>
                </div>

                <div className="flex items-center gap-2 text-[10px] text-[#5C5C5C] pt-2 justify-center">
                  <LucideIcons.ShieldCheck size={12} className="text-[#111111]" />
                  <span>Конфиденциальность гарантируется NDA</span>
                </div>
              </form>
            </div>
          )}
        </motion.div>
      </div>
    </AnimatePresence>
  );
};

// ---------------------------------------------------------------------------
// App
// ---------------------------------------------------------------------------
function App() {
  const [isAuditModalOpen, setIsAuditModalOpen] = useState(false);

  return (
    <div className="min-h-screen bg-[#FAFAFA] text-[#111111] font-sans relative selection:bg-[#111111] selection:text-[#FAFAFA]">
      <Header onOpenAudit={() => setIsAuditModalOpen(true)} />

      <main>
        <Hero onOpenAudit={() => setIsAuditModalOpen(true)} />
        <LeadProcessingDemo />
        <TelephonyDemo />
        <CalculatorSection onOpenAudit={() => setIsAuditModalOpen(true)} />
        <IntegrationsSection />
        <ComparisonSection onOpenAudit={() => setIsAuditModalOpen(true)} />
      </main>

      <Footer onOpenAudit={() => setIsAuditModalOpen(true)} />

      <AuditModal isOpen={isAuditModalOpen} onClose={() => setIsAuditModalOpen(false)} />
    </div>
  );
}

createRoot(document.getElementById('root')).render(
  <StrictMode>
    <App />
  </StrictMode>
);
    </script>
  </body>
</html>
